<section class="param-block">
  <p class="iva-config__hint">
    Este porcentaje se suma al valor de cada producto cuando el cliente tiene marcada la opción de aplicar IVA.
  </p>

  @if (error()) {
    <div class="rp-alert rp-alert--error">{{ error() }}</div>
  }
  @if (mensaje()) {
    <div class="rp-alert rp-alert--warning">{{ mensaje() }}</div>
  }

  @if (loading()) {
    <p class="rp-loading">Cargando...</p>
  } @else {
    <form class="iva-config__form" [formGroup]="form" (ngSubmit)="save()">
      <label class="iva-config__field" for="porcentajeIva">
        <span>Porcentaje de IVA</span>
        <input
          id="porcentajeIva"
          type="number"
          formControlName="porcentaje"
          min="0"
          max="100"
          step="0.01"
        />
      </label>
      <button type="submit" class="rp-btn rp-btn--primary" [disabled]="saving() || form.invalid">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </form>
  }
</section>
