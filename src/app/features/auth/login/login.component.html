<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5" />
          <path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12" />
          <path d="m14 16-3 3 3 3" />
          <path d="M8.293 13.596 7.196 9.5 3.1 10.598" />
          <path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843" />
          <path d="m13.378 9.633 4.096 1.098 1.097-4.096" />
        </svg>
      </span>
      <h1>Shalom App</h1>
      <p>Control de operaciones</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="rp-field">
        <label for="username">Usuario</label>
        <input id="username" type="text" formControlName="username" placeholder="Ingrese su usuario" />
      </div>

      <div class="rp-field">
        <label for="password">Contraseña</label>
        <div class="login-password">
          <input
            id="password"
            [type]="mostrarPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Ingrese su contraseña"
          />
          <button
            type="button"
            class="login-password__toggle"
            (click)="togglePassword()"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="mostrarPassword()"
          >
            @if (mostrarPassword()) {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M3 3l18 18M10.6 10.7a2.5 2.5 0 003.5 3.5M9.9 5.2A10.5 10.5 0 0121 12c-.6 1.1-1.4 2.1-2.4 2.9M6.1 6.2A10.4 10.4 0 003 12c1.6 3.4 5 6 9 6 1.2 0 2.4-.2 3.5-.7"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
                <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.8" />
              </svg>
            }
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="rp-alert rp-alert--error">
          {{ error() }}
        </div>
      }

      <button type="submit" class="rp-btn rp-btn--primary login-submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>
</div>
